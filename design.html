<script>
AFRAME.registerComponent('model-color', {
  schema: {
    color: {type: 'color', default: '#FFFFFF'}
  },

  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const model = this.el.getObject3D('mesh');
      const color = this.data.color;

      if (!model) return;

      model.traverse((node) => {
        if (node.isMesh && node.material) {
          const recolor = (material) => {
            const newMaterial = material.clone();
            if (newMaterial.color) {
              newMaterial.color.set(color);
            }
            return newMaterial;
          };

          node.material = Array.isArray(node.material)
            ? node.material.map(recolor)
            : recolor(node.material);
        }
      });
    });
  }
});


// 1. COLOR INTERACTION FOR GLTF MODELS
AFRAME.registerComponent('model-color-on-click', {
  init: function () {
    const el = this.el;
    let changed = false;
    let prepared = false;

    el.addEventListener('click', function () {
      const model = el.getObject3D('mesh');
      if (!model) return;

      // Make separate materials before changing colors
      if (!prepared) {
        model.traverse((node) => {
          if (node.isMesh && node.material) {
            node.material = Array.isArray(node.material)
              ? node.material.map(mat => mat.clone())
              : node.material.clone();
          }
        });
        prepared = true;
      }

      const newColor = changed ? '#FFFFFF' : '#FFD166';

      model.traverse((node) => {
        if (node.isMesh && node.material) {
          const materials = Array.isArray(node.material)
            ? node.material
            : [node.material];

          materials.forEach(mat => {
            if (mat.color) mat.color.set(newColor);
          });
        }
      });

      changed = !changed;
    });
  }
});


// 2. MOVEMENT INTERACTION
AFRAME.registerComponent('move-on-click', {
  init: function () {
    const el = this.el;
    let moved = false;

    el.addEventListener('click', function () {
      el.setAttribute('animation', {
        property: 'position',
        to: moved ? '13.75 0 -33' : '13 0 -33',
        dur: 700,
        easing: 'easeInOutQuad'
      });

      moved = !moved;
    });
  }
});


// 3. FEEDBACK INTERACTION
AFRAME.registerComponent('feedback-on-click', {
  init: function () {
    const el = this.el;

    el.addEventListener('click', function () {
      const feedback = document.querySelector('#feedbackText');

      feedback.setAttribute('value', 'Interaction successful!');
      feedback.setAttribute('color', '#22C55E');

      el.setAttribute('rotation', '0 45 0');
    });
  }
});

</script>
